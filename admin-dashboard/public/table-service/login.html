<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Cajun · Equipo</title><link rel="stylesheet" href="/mesas/assets/style.css"><main class="login-card"><img class="brand-logo" src="/mesas/assets/brand.svg" alt="King Cajun"><h1>Empecemos el servicio.</h1><p class="muted">Entra con tu usuario del equipo.</p><form id="login"><label>Usuario<input name="login" autocomplete="username" autocapitalize="none" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary full">Entrar</button><p class="error" id="error" role="alert"></p></form><p class="fine"><a href="/login?next=mesas">Acceso de la propietaria</a></p></main><script type="module">
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{const r=await fetch('/api/dine-in/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});const data=await r.json();if(!r.ok)throw Error(data.error);location.href=data.roles.includes('Waiter')||data.roles.includes('Manager')?'/mesas/app':'/mesas/cocina';}catch(e){document.querySelector('#error').textContent=e.message;}finally{button.disabled=false;}};
</script></html>
