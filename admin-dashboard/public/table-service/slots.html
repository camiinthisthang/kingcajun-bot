<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Cajun · Cupos</title><link rel="stylesheet" href="/mesas/assets/style.css"><main class="staff-form"><a href="/mesas/app?view=delivery">← Domicilios</a><h1>Cupos de entrega</h1><p class="muted">Máximo de pedidos por franja. Horarios de Medellín.</p><div id="slots"></div><h2>Nueva franja</h2><form id="new"><label>Inicio de entregas<input type="datetime-local" name="startsAt" required></label><label>Fin de entregas<input type="datetime-local" name="endsAt" required></label><label>Cierre de pedidos<input type="datetime-local" name="cutoffAt" required></label><label>Máximo de pedidos<input type="number" name="capacity" min="1" max="1000" required></label><button class="primary">Crear franja</button></form><p id="result" role="status"></p></main><script type="module">
const request=async(body)=>{const r=await fetch('/api/dine-in/windows',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error);return d;};
const load=async()=>{const slots=await request(),root=document.querySelector('#slots');root.replaceChildren(...slots.map(w=>{const form=document.createElement('form');form.className='history-event';const p=document.createElement('p');p.textContent=new Date(w.starts_at).toLocaleString('es-CO',{timeZone:'America/Bogota'})+' · '+(w.capacity-w.remaining)+' reservados';const label=document.createElement('label');label.textContent='Máximo de pedidos';const input=document.createElement('input');input.type='number';input.min='1';input.max='1000';input.value=w.capacity;label.append(input);const select=document.createElement('select');for(const [value,text] of [['open','Abierta'],['closed','Cerrada']]){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o);}select.value=w.status;const b=document.createElement('button');b.textContent='Guardar';form.append(p,label,select,b);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{await request({id:w.id,capacity:Number(input.value),status:select.value});b.textContent='Guardado';}catch(e){document.querySelector('#result').textContent=e.message;}finally{b.disabled=false;}};return form;}));};
document.querySelector('#new').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button'),f=Object.fromEntries(new FormData(form));b.disabled=true;try{await request({...f,capacity:Number(f.capacity),status:'open',startsAt:f.startsAt+':00-05:00',endsAt:f.endsAt+':00-05:00',cutoffAt:f.cutoffAt+':00-05:00'});form.reset();document.querySelector('#result').textContent='Franja creada.';await load();}catch(e){document.querySelector('#result').textContent=e.message;}finally{b.disabled=false;}};load().catch(e=>document.querySelector('#result').textContent=e.message);
</script></html>
