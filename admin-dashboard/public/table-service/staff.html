<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Cajun · Equipo</title><link rel="stylesheet" href="/mesas/assets/style.css"><main class="staff-form"><a href="/mesas/app">← Volver al servicio</a><h1>Tu equipo</h1><p class="muted">Cada persona entra con sus propios permisos.</p><div id="list"></div><h2>Agregar persona</h2><form><label>Nombre<input name="name" required maxlength="60"></label><label>Usuario<input name="login" required pattern="[-a-z0-9_]{3,40}" autocomplete="off"></label><label>Contraseña inicial<input name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><label class="check"><input type="checkbox" name="roles" value="Waiter">Mesas y despachos</label><label class="check"><input type="checkbox" name="roles" value="Cook">Cocina</label><label class="check"><input type="checkbox" name="roles" value="Manager">Aprobar cancelaciones</label><button class="primary">Crear usuario</button></form><p id="result" role="status"></p></main><script type="module">
const load=async()=>{const r=await fetch('/api/dine-in/staff');const rows=await r.json();if(!r.ok)throw Error(rows.error);const list=document.querySelector('#list');list.replaceChildren(...rows.map(s=>{const p=document.createElement('p');p.className='history-event';p.textContent=s.name+' · '+s.login+' · '+s.roles.join(', ');return p;}));};
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button'),f=new FormData(form);b.disabled=true;try{const r=await fetch('/api/dine-in/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...Object.fromEntries(f),roles:f.getAll('roles')})});const data=await r.json();if(!r.ok)throw Error(data.error);document.querySelector('#result').textContent='Usuario creado.';form.reset();await load();}catch(e){document.querySelector('#result').textContent=e.message;}finally{b.disabled=false;}};load().catch(e=>document.querySelector('#result').textContent=e.message);
</script></html>
